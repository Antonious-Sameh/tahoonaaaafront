<!doctype html>
<html lang="ar" dir="rtl">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
		<title>نظام إدارة المحل</title>
		<meta name="description" content="نظام إدارة محل قطع غيار السيارات — المبيعات والمشتريات والمخزون والتقارير" />

		<!-- Favicons -->
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="alternate icon" type="image/x-icon" href="/favicon.ico" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />

		<!-- Theme color (Android/Chrome address bar, installed PWA title bar) —
		     matches the app shell's persistent white header (AppLayout.jsx) -->
		<meta name="theme-color" content="#ffffff" />
		<meta name="color-scheme" content="light" />

		<!-- iOS/iPadOS home-screen install behavior -->
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="apple-mobile-web-app-title" content="إدارة المحل" />

		<!-- Modern (non-WebKit-prefixed) standalone-display hint -->
		<meta name="mobile-web-app-capable" content="yes" />

		<!-- Phone numbers appear throughout (customers/suppliers) — don't let
		     iOS auto-style them as tel: links -->
		<meta name="format-detection" content="telephone=no" />

		<!-- Windows tile color (legacy, negligible cost to include) -->
		<meta name="msapplication-TileColor" content="#2563eb" />
	</head>
	<body>
		<div id="root"></div>
		<div id="print-portal"></div>
		<script type="module" src="/src/main.jsx"></script>
	</body>
</html>
